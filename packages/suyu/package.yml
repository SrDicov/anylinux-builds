# suyu (fork dougchansan, rama mk8-recomp): emulador Switch. Se compila
# desde fuente en el contenedor Arch; el tarball precompilado es Ubuntu
# (pide libavcodec.so.60/boost1.83) y no enlaza en Arch.
# ponytail: system ffmpeg (Arch 9 vs Ubuntu 6 del upstream); si falla el build, -DYUZU_USE_BUNDLED_FFMPEG=ON. GCC nuevo eleva -Wconversion a error en vk_stall_probe.h: sed con static_cast<double> (el -Werror=conversion del target pisa cualquier flag global). Arch no instala los targets CMake *Private de Qt (Qt6Gui_PRIVATE_INCLUDE_DIRS vacio): el -I al dir qpa/ se resuelve con find.
name: suyu
source:
  type: git
  repo: https://github.com/dougchansan/suyu-v0.0.4
  ref: mk8-recomp
bin: /usr/bin/suyu
icon: DUMMY
desktop: DUMMY
main_bin: suyu
build_out: build/bin/suyu
extra_paths: [/usr/bin/suyu-cmd]
build_deps: [cmake, ninja, nasm, pkgconf, autoconf, glslang, qt6-base, qt6-svg, qt6-charts, qt6-multimedia, qt6-wayland, boost, ffmpeg, sdl3, libusb, openssl, alsa-lib, libpulse, libx11, libxext, libxrandr, libxcursor, libxi, libxfixes, libxkbcommon, libxss, libxtst, wayland, wayland-protocols, libdecor, libdrm, mesa, vulkan-headers, vulkan-utility-libraries, vulkan-icd-loader, zstd, lz4, zlib]
debloat: mesa
hooks: []
host_drivers: false
build_run:
  - git submodule update --init --depth 1 --jobs $(nproc)
  - sed -i -E 's/\b(framew|frame|gpuidle|draw|schedw|build|acquire|present) \* ms/static_cast<double>(\1) * ms/g; s/\(frame > known \? frame - known : 0\) \* ms/(frame > known ? static_cast<double>(frame - known) : 0.0) * ms/' src/video_core/renderer_vulkan/vk_stall_probe.h
  - QTGUI_PRIV=$(dirname $(dirname $(find /usr/include/qt6/QtGui -name qplatformnativeinterface.h -print -quit))) && cmake -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DENABLE_QT=ON -DYUZU_USE_BUNDLED_QT=OFF -DYUZU_TESTS=OFF -DENABLE_WEB_SERVICE=OFF -Dfmt_FORCE_BUNDLED=ON -DCMAKE_CXX_FLAGS="-Wno-conversion -I$QTGUI_PRIV"
  - cmake --build build --target suyu suyu-cmd
patch_run:
  - install -Dm755 /tmp/src-build/build/bin/suyu-cmd /usr/bin/suyu-cmd
