# brave-origin: variante Origin-trial de Brave (mismo upstream
# brave-browser, releases brave-origin-*). AUR *-bin: precompilado.
# OJO: /opt/brave-origin-bin/brave-origin es el WRAPPER chrome-wrapper
# (bash: mimeapps + exec relativo $HERE/brave con `|| true` que enmascara
# exit codes), NO el ELF (ese es .../brave, tambien desplegado). Se mantiene
# el wrapper como entry porque el .desktop pide Exec=brave-origin y el
# wrapper resuelve relativo sin fuga absoluta. No cambiar a ciegas.
# musl: el reporte externo da FALLIDO con "Could not load the Qt platform
# plugin wayland" del HOST musl. Causa raiz identificada: la imagen no
# llevaba gtk3 (Brave la dlopenea solo si hay bandeja, el strace de CI no
# la ve) y en musl la UI resolvia contra el Qt6 del host. Ver deploy: [gtk].
#
# PENDIENTE (sin host musl para validar, no se aplica a ciegas): el wrapper
# upstream usa `exec > >(exec cat)` (process substitution via /dev/fd, que
# musl no tiene), pega `|| true` al exec final (enmascara el exit code real)
# y escribe un mimeapps.list global del host. Un intento de neutralizar los
# tres produjo un SIGILL intermitente en host glibc; revertido. Reintentar
# con un host musl real.
# Chromium: runtime GL/ffmpeg desde el exe dir + sandbox desactivado.
name: brave-origin
source:
  type: aur
  pkg: brave-origin-bin
bin: /opt/brave-origin-bin/brave-origin
main_bin: brave-origin
icon: /usr/share/icons/hicolor/256x256/apps/brave-origin.png
desktop: /usr/share/applications/brave-origin.desktop
extra_paths: [/opt/brave-origin-bin]
data_from: /opt/brave-origin-bin
runtime_from: /opt/brave-origin-bin
debloat: mesa
hooks: [fix-namespaces.hook]
app_env: [ELECTRON_DISABLE_SANDBOX=1]
test_args: [--no-sandbox, --version]
# Brave dlopenea GTK solo si hay bandeja; el strace de CI no lo ve nunca, y
# en host musl la UI cae al Qt6 del host (musl) -> abort. gtk3/libxss son
# deps declaradas del PKGBUILD: se instalan y se despliegan a proposito.
deploy: [gtk]
