# portproton: launcher de juegos Windows (Proton/Wine). AUR: script
# bash + GUI yad; el Proton se descarga en RUNTIME a ~/PortProton.
# bin es el script /usr/bin/portproton (como bin_steam.sh en steam).
# yad va empaquetado (los dialogos son requisito duro en cualquier host);
# bwrap/proton los resuelve el script en el host/usuario.
name: portproton
source:
  type: aur
  pkg: portproton
bin: /usr/bin/portproton
main_bin: portproton
icon: /usr/share/icons/hicolor/scalable/apps/ru.linux_gaming.PortProton.svg
desktop: /usr/share/applications/ru.linux_gaming.PortProton.desktop
extra_paths: [/usr/bin/yad]
# vulkan-*: pre-satisfacen el proveedor virtual `vulkan-driver` ANTES del
# makepkg -si, para que no entre nvidia-utils al contenedor sin GPU
# (precedente steam: mismo combo, CI verde). El nvidia-userspace rompe
# el Xvfb del --test (core dumped).
build_deps: [vulkan-radeon, vulkan-intel, vulkan-nouveau]
debloat: mesa
hooks: [fix-namespaces.hook]
# El launcher aborta como root ("Do not run the script from the
# superuser!") y CI corre como root: mismo bypass que steam.
patch_run:
  - python3 -c 'p="/usr/bin/portproton"; s=open(p).read(); old="\"$(id -u)\" == \"0\""; assert s.count(old)==1; open(p,"w").write(s.replace(old,"\"$(id -u)\" == \"69\""))'
  - rm -f /usr/share/X11/xorg.conf.d/10-nvidia*.conf
