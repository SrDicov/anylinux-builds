# Steam (Valve). Fuente: .deb OFICIAL de Valve (repo.steampowered.com via
# la URL estable de steam.deb) = cero dias de reempaquetado; ademas el
# cliente se auto-actualiza al arrancar.
# OJO: /usr/bin/steam es un symlink a ../lib/steam/bin_steam.sh; se
# empaqueta el script REAL (leccion vesktop: nada de rutas absolutas).
# El cliente real (ELF 32-bit, INTERP /lib/ld-linux.so.2) llega en RUNTIME
# via bootstrap (~/.steam): patch_run inyecta fallback al loader lib32
# empaquetado cuando el host no tiene multilib (musl, etc).
name: steam
source:
  type: url
  url: https://cdn.akamai.steamstatic.com/client/installer/steam.deb
  url_version: apt http://repo.steampowered.com/steam/dists/stable/steam/binary-amd64/Packages steam-launcher
bin: /usr/lib/steam/bin_steam.sh
# El .desktop trae Exec=/usr/bin/steam; el binario real desplegado es
# bin_steam.sh: hay que declararlo o quick-sharun aborta buscandolo.
main_bin: bin_steam.sh
# /usr/lib/steam: lanzador + bootstraplinux tarball + steam_launcher py.
# /usr/lib32: stack 32-bit completo (quick-sharun lo detecta como LIB32 y
# empaqueta drivers; el cliente 32-bit y Proton lo necesitan).
extra_paths: [/usr/lib/steam, /usr/lib32]
runtime_from: /usr/lib/steam  # shims statvfs (.so) junto al binario
# extra_paths solo despliega ELFs: el tarball bootstrap, los .py de
# steam_launcher y el .desktop hay que copiarlos como DATA junto al binario.
data_from: /usr/lib/steam
icon: /usr/share/pixmaps/steam.png
desktop: /usr/share/applications/steam.desktop
build_deps: [curl, dbus, freetype2, gdk-pixbuf2, nss, lsof, usbutils, xdg-user-dirs, xorg-xrandr, xz, zenity, python, ttf-dejavu, xterm, lsb-release, pipewire, libpulse, libva, atk, at-spi2-core, libcups, alsa-lib, libdrm, mesa, vulkan-radeon, vulkan-intel, vulkan-nouveau, egl-wayland, vkd3d, mangohud, gamescope, gamemode, lib32-glibc, lib32-gcc-libs, lib32-libx11, lib32-libxss, lib32-libxinerama, lib32-libxcrypt, lib32-libxcrypt-compat, lib32-libgpg-error, lib32-libnm, lib32-libva, lib32-nss, lib32-alsa-plugins, lib32-fontconfig, lib32-libglvnd, lib32-systemd, lib32-pipewire, lib32-vulkan-icd-loader, lib32-vulkan-radeon, lib32-vulkan-intel, lib32-vulkan-nouveau, lib32-mesa, lib32-vkd3d, lib32-mangohud, lib32-freetype2, lib32-libpulse, lib32-gamemode]
debloat: mesa
hooks: [fix-namespaces.hook]
host_drivers: false
# Lanzador: exporta rutas de la imagen + envuelve ELFs del cliente con
# shims de loader explicito (verificado en musl) + shim statvfs via
# LD_PRELOAD (el updater falla en mounts read-only con 0 libres).
# Sin bwrap/proot/ns/mounts. Niveles: host multilib -> directo; falta
# loader32 -> loader empaquetado explicito (solo ELFs, nunca scripts).
patch_run:
  - gcc -O2 -ffreestanding -fno-builtin -fno-stack-protector -fPIC -nostdlib -shared -w -o /usr/lib/steam/steam-statvfs-shim64.so packages/steam/statvfs-shim.c
  - gcc -m32 -O2 -ffreestanding -fno-builtin -fno-stack-protector -fPIC -nostdlib -shared -w -o /usr/lib/steam/steam-statvfs-shim32.so packages/steam/statvfs-shim.c
  - python3 -c 'p="/usr/lib/steam/bin_steam.sh"; s=open(p).read(); old="\"$(id -u)\" == \"0\""; assert s.count(old)==1; open(p,"w").write(s.replace(old,"\"$(id -u)\" == \"69\""))'
  - printf '%s\n' 'import os, struct, sys' 'root = sys.argv[1]' 'def tmpl(var):' '    return "\n".join(["#!/bin/sh", "# steam-anylinux-wrapper", "_LD=\"" + var + "\"", "_D=\"${0%/*}\"; [ \"$_D\" = \"$0\" ] && _D=\".\"", "_B=\"${0##*/}\"", "if [ -n \"$_LD\" ] && [ -x \"$_LD\" ]; then", "  export LD_LIBRARY_PATH=\"$STEAM_IMG_LIBS${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\"", "  export LD_PRELOAD=\"$STEAM_IMG_SHIM64:$STEAM_IMG_SHIM32${LD_PRELOAD:+:$LD_PRELOAD}\"", "  exec \"$_LD\" --library-path \"$STEAM_IMG_LIBS\" \"$_D/$_B.orig\" \"$@\"", "fi", "exec \"$_D/$_B.orig\" \"$@\"", ""])' 'for base in ("ubuntu12_32", "ubuntu12_64", "linux32", "linux64"):' '    d = os.path.join(root, base)' '    if not os.path.isdir(d):' '        continue' '    for fn in sorted(os.listdir(d)):' '        if fn.endswith(".orig"):' '            continue' '        p = os.path.join(d, fn)' '        try:' '            f = open(p, "rb")' '        except OSError:' '            continue' '        with f:' '            data = f.read()' '        if data[:4] != b"\x7fELF":' '            continue' '        is64 = data[4:5] == b"\x02"' '        if is64:' '            pho, pes, pn = struct.unpack("<QHH", data[32:40] + data[54:56] + data[56:58])' '        else:' '            pho, pes, pn = struct.unpack("<IHH", data[28:32] + data[42:44] + data[44:46])' '        has_interp = False' '        for i in range(pn):' '            e = data[pho + i * pes:pho + (i + 1) * pes]' '            if struct.unpack("<I", e[:4])[0] == 3:' '                has_interp = True' '                break' '        if not has_interp:' '            continue' '        with open(p + ".orig", "wb") as f:' '            f.write(data)' '        with open(p, "w") as f:' '            f.write(tmpl("$STEAM_IMG_LD64" if is64 else "$STEAM_IMG_LD32"))' '        os.chmod(p, 0o755)' '        print("ldwrap: " + p, flush=True)' > /usr/lib/steam/steam-ldwrap.py
  - python3 -c 'p="/usr/lib/steam/bin_steam.sh"; s=open(p).read(); old="exec \"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\""; assert s.count(old)==1; new="_shdir=\"\"; if [ -n \"${SHARUN_DIR:-}\" ] && [ -x \"${SHARUN_DIR}/bin/bin_steam.sh\" ]; then _shdir=\"${SHARUN_DIR}/bin\"; else _shdir=\"$(dirname \"$(readlink -f \"$0\")\")\"; fi\nexport STEAM_IMG_ROOT=\"${SHARUN_DIR:-$_shdir/..}\"\n_LD64=\"\"; for _l in \"$_shdir/../lib/ld-linux-x86-64.so.2\" \"$_shdir/lib/ld-linux-x86-64.so.2\"; do if [ -x \"$_l\" ]; then _LD64=\"$_l\"; break; fi; done\n_LD32=\"\"; for _l in \"$_shdir/../lib/32/ld-linux.so.2\" \"$_shdir/../lib32/ld-linux.so.2\" \"$_shdir/lib/32/ld-linux.so.2\" \"$_shdir/lib32/ld-linux.so.2\"; do if [ -x \"$_l\" ]; then _LD32=\"$_l\"; break; fi; done\nexport STEAM_IMG_LD64=\"$_LD64\"\nexport STEAM_IMG_LD32=\"$_LD32\"\nexport STEAM_IMG_LIBS=\"$_shdir/../lib/32:$_shdir/../lib:$_shdir/../lib32:$_shdir/../lib\"\nif [ -x \"$_shdir/steam-statvfs-shim64.so\" ]; then export STEAM_IMG_SHIM64=\"$_shdir/steam-statvfs-shim64.so\"; fi\nif [ -x \"$_shdir/steam-statvfs-shim32.so\" ]; then export STEAM_IMG_SHIM32=\"$_shdir/steam-statvfs-shim32.so\"; fi\nif [ ! -e /lib/ld-linux.so.2 ] || [ ! -e /lib64/ld-linux-x86-64.so.2 ]; then _PY=\"\"; for _p in /usr/bin/python3 /usr/local/bin/python3; do if [ -x \"$_p\" ]; then _PY=\"$_p\"; break; fi; done; [ -n \"$_PY\" ] || _PY=\"$(command -v python3 2>/dev/null || echo python3)\"; if [ -n \"$_PY\" ] && [ -x \"$_shdir/steam-ldwrap.py\" ]; then \"$_PY\" \"$_shdir/steam-ldwrap.py\" \"$LAUNCHSTEAMDIR\" || :; fi; fi\nif [ -e /lib/ld-linux.so.2 ] && [ -e /lib64/ld-linux-x86-64.so.2 ]; then exec \"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\" ${log_opened+-srt-logger-opened} \"$@\"; fi\n_TGT=\"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\"; if [ -e \"$_shdir/steam-statvfs-shim64.so\" ] || [ -e \"$_shdir/steam-statvfs-shim32.so\" ]; then export LD_PRELOAD=\"$_shdir/steam-statvfs-shim64.so:$_shdir/steam-statvfs-shim32.so${LD_PRELOAD:+:$LD_PRELOAD}\"; fi; for _bl in \"$_shdir/../lib/32/ld-linux.so.2\" \"$_shdir/../lib32/ld-linux.so.2\" \"$_shdir/lib/32/ld-linux.so.2\" \"$_shdir/lib32/ld-linux.so.2\"; do if [ ! -e /lib/ld-linux.so.2 ] && [ -x \"$_bl\" ] && [ -f \"$_TGT\" ]; then case \"$_TGT\" in *.sh|*.py|*.bash|*.pl) continue;; esac; if command -v head >/dev/null 2>&1 && command -v grep >/dev/null 2>&1; then head -c 2 \"$_TGT\" 2>/dev/null | grep -q \"$(printf \x27\\177E\x27)\" || continue; fi; exec \"$_bl\" --library-path \"$_shdir/../lib/32:$_shdir/../lib32:$_shdir/lib/32:$_shdir/lib32\" \"$_TGT\" ${log_opened+-srt-logger-opened} \"$@\"; fi; done\n"+old; open(p,"w").write(s.replace(old,new))'
