# Steam (Valve). Fuente: .deb OFICIAL de Valve (repo.steampowered.com via
# la URL estable de steam.deb) = cero dias de reempaquetado; ademas el
# cliente se auto-actualiza al arrancar.
# OJO: /usr/bin/steam es un symlink a ../lib/steam/bin_steam.sh; se
# empaqueta el script REAL (leccion vesktop: nada de rutas absolutas).
# El cliente real (ELF 32-bit, INTERP /lib/ld-linux.so.2) llega en RUNTIME
# via bootstrap (~/.steam): patch_run inyecta fallback al loader lib32
# empaquetado cuando el host no tiene multilib (musl, etc).
name: steam
source:
  type: url
  url: https://cdn.akamai.steamstatic.com/client/installer/steam.deb
  url_version: apt http://repo.steampowered.com/steam/dists/stable/steam/binary-amd64/Packages steam-launcher
bin: /usr/lib/steam/bin_steam.sh
# El .desktop trae Exec=/usr/bin/steam; el binario real desplegado es
# bin_steam.sh: hay que declararlo o quick-sharun aborta buscandolo.
main_bin: bin_steam.sh
# /usr/lib/steam: lanzador + bootstraplinux tarball + steam_launcher py.
# /usr/lib32: stack 32-bit completo (quick-sharun lo detecta como LIB32 y
# empaqueta drivers; el cliente 32-bit y Proton lo necesitan).
extra_paths: [/usr/lib/steam, /usr/lib32]
runtime_from: /usr/lib/steam  # shims statvfs (.so) junto al binario
# extra_paths solo despliega ELFs: el tarball bootstrap, los .py de
# steam_launcher y el .desktop hay que copiarlos como DATA junto al binario.
data_from: /usr/lib/steam
icon: /usr/share/pixmaps/steam.png
desktop: /usr/share/applications/steam.desktop
build_deps: [curl, dbus, freetype2, gdk-pixbuf2, nss, lsof, usbutils, xdg-user-dirs, xorg-xrandr, xz, zenity, python, ttf-dejavu, xterm, lsb-release, pipewire, libpulse, libva, atk, at-spi2-core, libcups, alsa-lib, libdrm, mesa, vulkan-radeon, vulkan-intel, vulkan-nouveau, egl-wayland, vkd3d, mangohud, gamescope, gamemode, lib32-glibc, lib32-gcc-libs, lib32-libx11, lib32-libxss, lib32-libxinerama, lib32-libxcrypt, lib32-libxcrypt-compat, lib32-libgpg-error, lib32-libnm, lib32-libva, lib32-nss, lib32-alsa-plugins, lib32-fontconfig, lib32-libglvnd, lib32-systemd, lib32-pipewire, lib32-vulkan-icd-loader, lib32-vulkan-radeon, lib32-vulkan-intel, lib32-vulkan-nouveau, lib32-mesa, lib32-vkd3d, lib32-mangohud, lib32-freetype2, lib32-libpulse, lib32-gamemode, libxtst, libxrandr, libxfixes, libxi, libxrender, lib32-libxtst, lib32-libxrandr, lib32-libxfixes, lib32-libxi, lib32-libxrender, lib32-libxext]
debloat: mesa
hooks: [fix-namespaces.hook]
host_drivers: false
# Lanzador: exporta rutas de la imagen + shim statvfs/execve via LD_PRELOAD
# (el updater falla en mounts read-only con 0 libres; el router execve
# ejecuta ELFs sin loader del host SIN tocar ficheros en disco, asi el
# verify de checksums de Valve pasa y cubre binarios de futuros updates).
# Sin bwrap/proot/ns/mounts. Niveles: host multilib -> directo; falta
# loader32 -> loader empaquetado explicito (primer salto) + router execve
# (hijos). Los wrappers antiguos (*.orig) se restauran solos al arrancar.
patch_run:
  - gcc -O2 -ffreestanding -fno-builtin -fno-stack-protector -fPIC -nostdlib -shared -w -o /usr/lib/steam/steam-statvfs-shim64.so packages/steam/statvfs-shim.c
  - gcc -m32 -O2 -ffreestanding -fno-builtin -fno-stack-protector -fPIC -nostdlib -shared -w -o /usr/lib/steam/steam-statvfs-shim32.so packages/steam/statvfs-shim.c
  - python3 -c 'p="/usr/lib/steam/bin_steam.sh"; s=open(p).read(); old="\"$(id -u)\" == \"0\""; assert s.count(old)==1; open(p,"w").write(s.replace(old,"\"$(id -u)\" == \"69\""))'
  - python3 -c 'p="/usr/lib/steam/bin_steam.sh"; s=open(p).read(); old="exec \"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\""; assert s.count(old)==1; new="cd \"${LAUNCHSTEAMDIR:-$HOME}\" 2>/dev/null || :; for _rd in ubuntu12_32 ubuntu12_64 linux32 linux64; do for _rf in \"${LAUNCHSTEAMDIR}/$_rd\"/*; do case \"$_rf\" in *.orig) continue;; esac; if [ -f \"$_rf\" ] && [ -f \"$_rf.orig\" ] && head -c 64 \"$_rf\" 2>/dev/null | grep -q steam-anylinux-wrapper; then mv -f \"$_rf.orig\" \"$_rf\"; echo \"unwrapped: $_rf\"; fi; done; done\n_STEAMSH=\"$LAUNCHSTEAMDIR/steam.sh\"; if [ -f \"$_STEAMSH\" ] && grep -q -- \"--checkpoint=1\" \"$_STEAMSH\" 2>/dev/null; then sed -i \"\" \"s/tar --blocking-factor=\${BF} --checkpoint=1.*-xf/tar -xf/\" \"$_STEAMSH\" 2>/dev/null || :; fi\n_shdir=\"\"; if [ -n \"${SHARUN_DIR:-}\" ] && [ -x \"${SHARUN_DIR}/bin/bin_steam.sh\" ]; then _shdir=\"${SHARUN_DIR}/bin\"; else _shdir=\"$(dirname \"$(readlink -f \"$0\")\")\"; fi\nexport STEAM_IMG_ROOT=\"${SHARUN_DIR:-$_shdir/..}\"\n_LD64=\"\"; for _l in \"$_shdir/../lib/ld-linux-x86-64.so.2\" \"$_shdir/lib/ld-linux-x86-64.so.2\"; do if [ -x \"$_l\" ]; then _LD64=\"$_l\"; break; fi; done\n_LD32=\"\"; for _l in \"$_shdir/../lib/32/ld-linux.so.2\" \"$_shdir/../lib32/ld-linux.so.2\" \"$_shdir/lib/32/ld-linux.so.2\" \"$_shdir/lib32/ld-linux.so.2\"; do if [ -x \"$_l\" ]; then _LD32=\"$_l\"; break; fi; done\nexport STEAM_IMG_LD64=\"$_LD64\"\nexport STEAM_IMG_LD32=\"$_LD32\"\nexport STEAM_IMG_LIBS=\"$_shdir/../lib/32:$_shdir/../lib:$_shdir/../lib32:$_shdir/../lib\"\nfor _d in ubuntu12_32 ubuntu12_64 linux32 linux64; do mkdir -p \"$LAUNCHSTEAMDIR/$_d\" 2>/dev/null || :; done\nif [ -n \"$_LD32\" ] && [ -x \"$_LD32\" ]; then for _d in ubuntu12_32 linux32; do cp -f \"$_LD32\" \"$LAUNCHSTEAMDIR/$_d/ld-linux.so.2\" 2>/dev/null || :; done; _LD32I=\"$_LD32\"; _LD32=\"$LAUNCHSTEAMDIR/ubuntu12_32/ld-linux.so.2\"; export STEAM_IMG_LD32=\"$_LD32:$_LD32I\"; fi\nif [ -n \"$_LD64\" ] && [ -x \"$_LD64\" ]; then for _d in ubuntu12_64 linux64; do cp -f \"$_LD64\" \"$LAUNCHSTEAMDIR/$_d/ld-linux-x86-64.so.2\" 2>/dev/null || :; done; _LD64I=\"$_LD64\"; _LD64=\"$LAUNCHSTEAMDIR/ubuntu12_64/ld-linux-x86-64.so.2\"; export STEAM_IMG_LD64=\"$_LD64:$_LD64I\"; fi\nif [ -x \"$_shdir/steam-statvfs-shim64.so\" ]; then export STEAM_IMG_SHIM64=\"$_shdir/steam-statvfs-shim64.so\"; fi\nif [ -x \"$_shdir/steam-statvfs-shim32.so\" ]; then export STEAM_IMG_SHIM32=\"$_shdir/steam-statvfs-shim32.so\"; fi\nif [ -e /lib/ld-linux.so.2 ] && [ -e /lib64/ld-linux-x86-64.so.2 ]; then exec \"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\" ${log_opened+-srt-logger-opened} \"$@\"; fi\n_TGT=\"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\"; if [ -e \"$_shdir/steam-statvfs-shim64.so\" ] || [ -e \"$_shdir/steam-statvfs-shim32.so\" ]; then export LD_PRELOAD=\"$_shdir/steam-statvfs-shim64.so:$_shdir/steam-statvfs-shim32.so${LD_PRELOAD:+:$LD_PRELOAD}\"; fi; for _bl in \"$LAUNCHSTEAMDIR/ubuntu12_32/ld-linux.so.2\" \"$LAUNCHSTEAMDIR/linux32/ld-linux.so.2\" \"$LAUNCHSTEAMDIR/ubuntu12_64/ld-linux-x86-64.so.2\" \"$LAUNCHSTEAMDIR/linux64/ld-linux-x86-64.so.2\" \"$_shdir/../lib/32/ld-linux.so.2\" \"$_shdir/../lib32/ld-linux.so.2\" \"$_shdir/lib/32/ld-linux.so.2\" \"$_shdir/lib32/ld-linux.so.2\"; do if [ ! -e /lib/ld-linux.so.2 ] && [ -x \"$_bl\" ] && [ -f \"$_TGT\" ]; then case \"$_TGT\" in *.sh|*.py|*.bash|*.pl) continue;; esac; if command -v head >/dev/null 2>&1 && command -v grep >/dev/null 2>&1; then head -c 2 \"$_TGT\" 2>/dev/null | grep -q \"$(printf \x27\\177E\x27)\" || continue; fi; exec \"$_bl\" --library-path \"$_shdir/../lib/32:$_shdir/../lib32:$_shdir/lib/32:$_shdir/lib32\" \"$_TGT\" ${log_opened+-srt-logger-opened} \"$@\"; fi; done\n"+old; open(p,"w").write(s.replace(old,new))'
