# Steam (Valve). Fuente: .deb OFICIAL de Valve (repo.steampowered.com via
# la URL estable de steam.deb) = cero dias de reempaquetado; ademas el
# cliente se auto-actualiza al arrancar.
# OJO: /usr/bin/steam es un symlink a ../lib/steam/bin_steam.sh; se
# empaqueta el script REAL (leccion vesktop: nada de rutas absolutas).
# El cliente real (ELF 32-bit, INTERP /lib/ld-linux.so.2) llega en RUNTIME
# via bootstrap (~/.steam): patch_run inyecta fallback al loader lib32
# empaquetado cuando el host no tiene multilib (musl, etc).
name: steam
source:
  type: url
  url: https://cdn.akamai.steamstatic.com/client/installer/steam.deb
  url_version: apt http://repo.steampowered.com/steam/dists/stable/steam/binary-amd64/Packages steam-launcher
bin: /usr/lib/steam/bin_steam.sh
# El .desktop trae Exec=/usr/bin/steam; el binario real desplegado es
# bin_steam.sh: hay que declararlo o quick-sharun aborta buscandolo.
main_bin: bin_steam.sh
# /usr/lib/steam: lanzador + bootstraplinux tarball + steam_launcher py.
# /usr/lib32: stack 32-bit completo (quick-sharun lo detecta como LIB32 y
# empaqueta drivers; el cliente 32-bit y Proton lo necesitan).
extra_paths: [/usr/lib/steam, /usr/lib32, /usr/bin/bwrap]
# extra_paths solo despliega ELFs: el tarball bootstrap, los .py de
# steam_launcher y el .desktop hay que copiarlos como DATA junto al binario.
data_from: /usr/lib/steam
icon: /usr/share/pixmaps/steam.png
desktop: /usr/share/applications/steam.desktop
build_deps: [bubblewrap, curl, dbus, freetype2, gdk-pixbuf2, nss, lsof, usbutils, xdg-user-dirs, xorg-xrandr, xz, zenity, python, ttf-dejavu, xterm, lsb-release, pipewire, libpulse, libva, atk, at-spi2-core, libcups, alsa-lib, libdrm, mesa, vulkan-radeon, vulkan-intel, vulkan-nouveau, egl-wayland, vkd3d, mangohud, gamescope, gamemode, lib32-glibc, lib32-gcc-libs, lib32-libx11, lib32-libxss, lib32-libxinerama, lib32-libxcrypt, lib32-libxcrypt-compat, lib32-libgpg-error, lib32-libnm, lib32-libva, lib32-nss, lib32-alsa-plugins, lib32-fontconfig, lib32-libglvnd, lib32-systemd, lib32-pipewire, lib32-vulkan-icd-loader, lib32-vulkan-radeon, lib32-vulkan-intel, lib32-vulkan-nouveau, lib32-mesa, lib32-vkd3d, lib32-mangohud, lib32-freetype2, lib32-libpulse, lib32-gamemode]
debloat: mesa
hooks: [fix-namespaces.hook]
host_drivers: false
# patch_run: (1) permite root (solo para el smoke test de CI); (2) lanzador
# en 3 niveles: host multilib -> directo; falta loader32 -> loader
# empaquetado; musl/host pelado -> bwrap con loaders inyectados (cubre al
# UI helper 64-bit, nieto del lanzador).
patch_run:
  - python3 -c 'p="/usr/lib/steam/bin_steam.sh"; s=open(p).read(); old="\"$(id -u)\" == \"0\""; assert s.count(old)==1; open(p,"w").write(s.replace(old,"\"$(id -u)\" == \"69\""))'
  - python3 -c 'p="/usr/lib/steam/bin_steam.sh"; s=open(p).read(); old="exec \"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\""; assert s.count(old)==1; new="if [ -e /lib/ld-linux.so.2 ] && [ -e /lib64/ld-linux-x86-64.so.2 ]; then exec \"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\" ${log_opened+-srt-logger-opened} \"$@\"; fi\n_shdir=\"$(dirname \"$(readlink -f \"$0\")\")\"\nif [ -e /lib64/ld-linux-x86-64.so.2 ]; then for _bl in \"$_shdir/../lib/32/ld-linux.so.2\" \"$_shdir/../lib32/ld-linux.so.2\"; do if [ -x \"$_bl\" ]; then exec \"$_bl\" --library-path \"$_shdir/../lib/32:$_shdir/../lib32:$_shdir/lib/32:$_shdir/lib32\" \"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\" ${log_opened+-srt-logger-opened} \"$@\"; fi; done; fi\n_LD64=\"\"; for _l in \"$_shdir/../lib/ld-linux-x86-64.so.2\" \"$_shdir/lib/ld-linux-x86-64.so.2\"; do if [ -x \"$_l\" ]; then _LD64=\"$_l\"; break; fi; done\n_LD32=\"\"; for _l in \"$_shdir/../lib/32/ld-linux.so.2\" \"$_shdir/../lib32/ld-linux.so.2\"; do if [ -x \"$_l\" ]; then _LD32=\"$_l\"; break; fi; done\nif [ -x \"$_shdir/bwrap\" ] && [ -n \"$_LD64\" ]; then _bw=\"$_shdir/bwrap --bind / / --dev /dev --proc /proc\"; [ -e /lib/ld-linux.so.2 ] || _bw=\"$_bw --file $_LD32 /lib/ld-linux.so.2\"; [ -e /lib64/ld-linux-x86-64.so.2 ] || _bw=\"$_bw --file $_LD64 /lib64/ld-linux-x86-64.so.2\"; exec $_bw -- \"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\" ${log_opened+-srt-logger-opened} \"$@\"; fi\n"+old; open(p,"w").write(s.replace(old,new))'
