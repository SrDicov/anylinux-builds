# Steam (Valve). Fuente: .deb OFICIAL de Valve (repo.steampowered.com via
# la URL estable de steam.deb) = cero dias de reempaquetado; ademas el
# cliente se auto-actualiza al arrancar.
# OJO: /usr/bin/steam es un symlink a ../lib/steam/bin_steam.sh; se
# empaqueta el script REAL (leccion vesktop: nada de rutas absolutas).
# El cliente real (ELF 32-bit, INTERP /lib/ld-linux.so.2) llega en RUNTIME
# via bootstrap (~/.steam): patch_run inyecta fallback al loader lib32
# empaquetado cuando el host no tiene multilib (musl, etc).
name: steam
source:
  type: url
  url: https://cdn.akamai.steamstatic.com/client/installer/steam.deb
  url_version: apt http://repo.steampowered.com/steam/dists/stable/steam/binary-amd64/Packages steam-launcher
bin: /usr/lib/steam/bin_steam.sh
# El .desktop trae Exec=/usr/bin/steam; el binario real desplegado es
# bin_steam.sh: hay que declararlo o quick-sharun aborta buscandolo.
main_bin: bin_steam.sh
# /usr/lib/steam: lanzador + bootstraplinux tarball + steam_launcher py.
# /usr/lib32: stack 32-bit completo (quick-sharun lo detecta como LIB32 y
# empaqueta drivers; el cliente 32-bit y Proton lo necesitan).
extra_paths: [/usr/lib/steam, /usr/lib32]
# extra_paths solo despliega ELFs: el tarball bootstrap, los .py de
# steam_launcher y el .desktop hay que copiarlos como DATA junto al binario.
data_from: /usr/lib/steam
icon: /usr/share/pixmaps/steam.png
desktop: /usr/share/applications/steam.desktop
build_deps: [curl, dbus, freetype2, gdk-pixbuf2, nss, lsof, usbutils, xdg-user-dirs, xorg-xrandr, xz, zenity, python, ttf-dejavu, xterm, lsb-release, pipewire, libpulse, libva, atk, at-spi2-core, libcups, alsa-lib, libdrm, mesa, vulkan-radeon, vulkan-intel, vulkan-nouveau, egl-wayland, vkd3d, mangohud, gamescope, gamemode, lib32-glibc, lib32-gcc-libs, lib32-libx11, lib32-libxss, lib32-libxinerama, lib32-libxcrypt, lib32-libxcrypt-compat, lib32-libgpg-error, lib32-libnm, lib32-libva, lib32-nss, lib32-alsa-plugins, lib32-fontconfig, lib32-libglvnd, lib32-systemd, lib32-pipewire, lib32-vulkan-icd-loader, lib32-vulkan-radeon, lib32-vulkan-intel, lib32-vulkan-nouveau, lib32-mesa, lib32-vkd3d, lib32-mangohud, lib32-freetype2, lib32-libpulse, lib32-gamemode]
debloat: mesa
hooks: [fix-namespaces.hook]
host_drivers: false
# en 3 niveles: (0) parcheo INTERP de helpers 64-bit a copia corta del
# loader (verificado en musl); (1) host multilib -> directo; (2) falta
# loader32 -> loader empaquetado explicito. Sin bwrap/proot/ns/mounts.
patch_run:
  - python3 -c 'p="/usr/lib/steam/bin_steam.sh"; s=open(p).read(); old="\"$(id -u)\" == \"0\""; assert s.count(old)==1; open(p,"w").write(s.replace(old,"\"$(id -u)\" == \"69\""))'
  - printf '%s\n' 'import os, struct, sys' 'root, new32, new64 = sys.argv[1], sys.argv[2].encode(), sys.argv[3].encode()' 'for base in ("ubuntu12_32", "ubuntu12_64", "linux32", "linux64"):' '    d = os.path.join(root, base)' '    if not os.path.isdir(d):' '        continue' '    for fn in sorted(os.listdir(d)):' '        p = os.path.join(d, fn)' '        try:' '            f = open(p, "r+b")' '        except OSError:' '            continue' '        with f:' '            if f.read(4) != b"\x7fELF":' '                continue' '            is64 = f.read(1) == b"\x02"' '            if is64:' '                f.seek(32); r = f.read(26)' '                pho, pes, pn = struct.unpack("<QHH", r[0:8] + r[22:24] + r[24:26])' '            else:' '                f.seek(28); r = f.read(18)' '                pho, pes, pn = struct.unpack("<IHH", r[0:4] + r[14:16] + r[16:18])' '            new = new64 if is64 else new32' '            for i in range(pn):' '                f.seek(pho + i * pes)' '                e = f.read(56 if is64 else 32)' '                if struct.unpack("<I", e[:4])[0] != 3:' '                    continue' '                if is64:' '                    io, fs = struct.unpack("<QQ", e[8:16] + e[32:40])' '                else:' '                    io, fs = struct.unpack("<II", e[4:8] + e[16:20])' '                f.seek(io)' '                cur = f.read(fs).split(b"\0")[0]' '                if not cur or cur == new or os.path.exists(cur):' '                    break' '                if len(new) + 1 > fs:' '                    break' '                f.seek(io)' '                f.write(new + b"\0" * (fs - len(new)))' '                print("ldpatch: " + p, flush=True)' '                break' > /usr/lib/steam/steam-ldpatch.py
  - python3 -c 'p="/usr/lib/steam/bin_steam.sh"; s=open(p).read(); old="exec \"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\""; assert s.count(old)==1; new="_shdir=\"\"; if [ -n \"${SHARUN_DIR:-}\" ] && [ -x \"${SHARUN_DIR}/bin/bin_steam.sh\" ]; then _shdir=\"${SHARUN_DIR}/bin\"; else _shdir=\"$(dirname \"$(readlink -f \"$0\")\")\"; fi\nif [ ! -e /lib/ld-linux.so.2 ] || [ ! -e /lib64/ld-linux-x86-64.so.2 ]; then _PY=\"\"; for _p in /usr/bin/python3 /usr/local/bin/python3; do if [ -x \"$_p\" ]; then _PY=\"$_p\"; break; fi; done; [ -n \"$_PY\" ] || _PY=\"$(command -v python3 2>/dev/null || echo python3)\"; _LD64=\"\"; for _l in \"$_shdir/../lib/ld-linux-x86-64.so.2\" \"$_shdir/lib/ld-linux-x86-64.so.2\"; do if [ -x \"$_l\" ]; then _LD64=\"$_l\"; break; fi; done; _LD32=\"\"; for _l in \"$_shdir/../lib/32/ld-linux.so.2\" \"$_shdir/../lib32/ld-linux.so.2\" \"$_shdir/lib/32/ld-linux.so.2\" \"$_shdir/lib32/ld-linux.so.2\"; do if [ -x \"$_l\" ]; then _LD32=\"$_l\"; break; fi; done; _S64=\"\"; _S32=\"\"; if [ -n \"$_LD64\" ] && [ -n \"$_LD32\" ]; then for _d in /tmp \"${XDG_RUNTIME_DIR:-/tmp}\" \"$HOME\"; do [ -n \"$_d\" ] && [ -d \"$_d\" ] || continue; _S64=\"$_d/.l64-$(id -u)\"; _S32=\"$_d/.l32-$(id -u)\"; [ \"${#_S64}\" -le 27 ] && [ \"${#_S32}\" -le 19 ] || { _S64=\"\"; _S32=\"\"; continue; }; if cp -f \"$_LD64\" \"$_S64\" 2>/dev/null && cp -f \"$_LD32\" \"$_S32\" 2>/dev/null && \"$_S64\" --version >/dev/null 2>&1 && \"$_S32\" --version >/dev/null 2>&1; then break; else _S64=\"\"; _S32=\"\"; fi; done; fi; if [ -n \"$_S64\" ] && [ -n \"$_S32\" ] && [ -x \"$_shdir/steam-ldpatch.py\" ]; then \"$_PY\" \"$_shdir/steam-ldpatch.py\" \"$LAUNCHSTEAMDIR\" \"$_S32\" \"$_S64\" || :; export LD_LIBRARY_PATH=\"$_shdir/../lib/32:$_shdir/../lib:$_shdir/../lib32:$_shdir/../lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}\"; fi; fi\nif [ -e /lib/ld-linux.so.2 ] && [ -e /lib64/ld-linux-x86-64.so.2 ]; then exec \"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\" ${log_opened+-srt-logger-opened} \"$@\"; fi\n_TGT=\"$LAUNCHSTEAMDIR/$STEAMBOOTSTRAP\"; for _bl in \"$_shdir/../lib/32/ld-linux.so.2\" \"$_shdir/../lib32/ld-linux.so.2\" \"$_shdir/lib/32/ld-linux.so.2\" \"$_shdir/lib32/ld-linux.so.2\"; do if [ ! -e /lib/ld-linux.so.2 ] && [ -x \"$_bl\" ] && [ -f \"$_TGT\" ]; then case \"$_TGT\" in *.sh|*.py|*.bash|*.pl) continue;; esac; if command -v head >/dev/null 2>&1 && command -v grep >/dev/null 2>&1; then head -c 2 \"$_TGT\" 2>/dev/null | grep -q \"$(printf \x27\\177E\x27)\" || continue; fi; exec \"$_bl\" --library-path \"$_shdir/../lib/32:$_shdir/../lib32:$_shdir/lib/32:$_shdir/lib32\" \"$_TGT\" ${log_opened+-srt-logger-opened} \"$@\"; fi; done\n"+old; open(p,"w").write(s.replace(old,new))'
