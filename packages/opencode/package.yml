# opencode estable (anomalyco fork, rama dev == linea v1.x):
# compilado desde fuente con Bun, target baseline (sin AVX2).
name: opencode
source:
  type: git
  repo: https://github.com/anomalyco/opencode.git
  ref: dev
bin: /usr/bin/opencode
icon: DUMMY
desktop: DUMMY
main_bin: opencode
build_deps: [bun]
debloat: none
hooks: []
host_drivers: false
test_args: [--version]
build_out: packages/cli/dist/cli-linux-x64-baseline/bin/opencode
build_run:
  - bun install
  - cd packages/cli
  - bun run script/build.ts --single --baseline
