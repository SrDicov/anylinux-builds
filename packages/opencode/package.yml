# opencode estable (anomalyco fork, linea v1.x): binario precompilado
# baseline del release latest (sin AVX2, corre en cualquier x86_64).
# url_version sigue el tag latest; el tarball trae el binario suelto.
name: opencode
source:
  type: url
  url: https://github.com/anomalyco/opencode/releases/latest/download/opencode-linux-x64-baseline.tar.gz
  url_version: github:anomalyco/opencode
  url_bin: opencode
bin: /usr/bin/opencode
icon: DUMMY
desktop: DUMMY
main_bin: opencode
build_deps: []
debloat: none
hooks: []
host_drivers: false
test_args: [--version]
