# heroic: Heroic Games Launcher (Electron). AUR *-bin: reempaqueta
# el .pacman oficial del upstream, sin compilar.
# /usr/bin/heroic es symlink a /opt/Heroic/heroic: se empaqueta el REAL.
# Electron: data + runtime junto al binario, sandbox desactivado.
name: heroic
source:
  type: aur
  pkg: heroic-games-launcher-bin
bin: /opt/Heroic/heroic
icon: DUMMY
desktop: DUMMY
main_bin: heroic
extra_paths: [/opt/Heroic]
data_from: /opt/Heroic
runtime_from: /opt/Heroic
debloat: mesa
hooks: [fix-namespaces.hook]
app_env: [ELECTRON_DISABLE_SANDBOX=1]
# nile es ELF (a diferencia de legendary/gogdl, que son zips autoextraibles
# y data_from los clona en su sitio): extra_paths lo aplana a bin/nile pero
# el backend lo spawnea como ./nile con cwd=x64/linux -> ENOENT (Amazon roto).
link_run:
  - ln -sfn ../../../../../../nile "$APPDIR/bin/resources/app.asar.unpacked/build/bin/x64/linux/nile"
