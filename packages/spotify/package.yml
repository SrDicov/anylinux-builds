# spotify: cliente oficial (CEF, no Electron). AUR: reempaqueta el .deb
# de repository.spotify.com con checks Release/Packages verificados.
# OJO: /usr/bin/spotify es un script; se empaqueta el binario REAL
# de /opt (regla wrapper-scripts: nada de rutas absolutas al sistema).
# CEF: helpers + .pak/locales + GL/ffmpeg desde el exe dir.
# CI es root: el smoke usa --no-sandbox (ELECTRON_DISABLE_SANDBOX no lo
# lee CEF, no se hornea env muerto).
name: spotify
source:
  type: aur
  pkg: spotify
bin: /opt/spotify/spotify
main_bin: spotify
icon: /usr/share/icons/hicolor/256x256/apps/spotify.png
desktop: /usr/share/applications/spotify.desktop
extra_paths: [/opt/spotify]
data_from: /opt/spotify
runtime_from: /opt/spotify
debloat: mesa
hooks: [fix-namespaces.hook]
test_args: [--no-sandbox, --version]
# CEF resuelve icudtl.dat junto a libcef.so (lib/spotify/), no junto al exe:
# en /opt conviven, pero sharun los parte y el GUI muere con SIGTRAP sin
# ICU (solo --version sobrevive, por eso el CI nunca lo vio).
link_run:
  - mkdir -p "$APPDIR/lib/spotify"
  - ln -sfn ../../bin/icudtl.dat "$APPDIR/lib/spotify/icudtl.dat"
  - ln -sfn ../../bin/v8_context_snapshot.bin "$APPDIR/lib/spotify/v8_context_snapshot.bin"
  - ln -sfn ../../bin/resources.pak "$APPDIR/lib/spotify/resources.pak"
  - ln -sfn ../../bin/chrome_100_percent.pak "$APPDIR/lib/spotify/chrome_100_percent.pak"
  - ln -sfn ../../bin/chrome_200_percent.pak "$APPDIR/lib/spotify/chrome_200_percent.pak"
  - ln -sfn ../../bin/locales "$APPDIR/lib/spotify/locales"
