# reaper: DAW de Cockos 7.80 PINNEADO (excepcion a la regla sin-versiones:
# el tarball oficial lleva la version en el nombre, no hay URL estable,
# ni git publico ni AUR. Bump = cambiar `url` (el resto de rutas no
# llevan version). ETag del fichero inmutable: no reconstruye solo.
# El binario necesita su arbol (libSwell, Plugins/, InstallData/):
# url instala el binario suelto y patch_run escenifica el resto a /opt.
name: reaper
source:
  type: url
  url: https://www.reaper.fm/files/7.x/reaper780_linux_x86_64.tar.xz
  url_bin: reaper_linux_x86_64/REAPER/reaper
bin: /usr/bin/reaper
icon: DUMMY
desktop: DUMMY
main_bin: reaper
extra_paths: [/opt/REAPER]
data_from: /opt/REAPER
# REAPER carga libSwell.so por ruta relativa al exe (igual que el GL de
# Chromium): tiene que estar junto al binario o muere con
# "cannot open shared object file" en el --test.
runtime_from: /opt/REAPER
# REAPER es un ELF dynamic enlazado a ALSA + X11 + GTK: sin estas el
# quick-sharun aborta con "libasound.so.2 => not found".
build_deps: [alsa-lib, gtk3, libx11, libxext, libxss, dbus]
debloat: common
patch_run:
  - cp -r /tmp/payload-ex/reaper_linux_x86_64/REAPER /opt/REAPER
