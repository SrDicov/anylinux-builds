# Template: paquete de AUR (idealmente *-bin: precompilado, sin toolchain).
# Se compila como usuario no-root con makepkg dentro del contenedor Arch.
# OJO: el lanzador /usr/bin/vesktop es un script con `exec /opt/...`
# absoluto; hay que empaquetar el binario REAL o el AppImage solo
# funciona en la maquina que lo compilo (fuga por ruta absoluta).
# NOTA: verifica bin/icon/desktop en la primera compilacion (dispatch manual).
name: vesktop-bin
source:
  type: aur
  pkg: vesktop-bin
bin: /opt/vesktop/vesktop
# Extra .so + helper binaries from the app dir (libffmpeg with codecs,
# ANGLE libs, crashpad). Data files come via data_from below.
extra_paths: [/opt/vesktop]
icon: DUMMY
desktop: DUMMY
main_bin: vesktop
build_deps: []
debloat: mesa
hooks: [fix-namespaces.hook]
host_drivers: false
# Electron runtime data (icudtl.dat, *.pak, locales/, app.asar) must sit
# next to the binary; quick-sharun only deploys libs/bins.
data_from: /opt/vesktop
# Chromium dlopens its GL/software stack (libEGL, libGLESv2, SwiftShader)
# and libffmpeg from the exe dir; without them the GPU process dies and
# no frame is ever presented (window never maps, app runs headless).
runtime_from: /opt/vesktop
# Chromium sandbox breaks inside the AppImage (dead zygote -> FATAL);
# disable it by default (verified: Discord loads, window opens).
app_env: [ELECTRON_DISABLE_SANDBOX=1]
